version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: portfolio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ***REMOVED***
      POSTGRES_DB: portfolio_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pg***REMOVED***:
    image: dpage/pg***REMOVED***4:latest
    container_name: portfolio-pg***REMOVED***
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ***REMOVED***@portfolio.local
      PGADMIN_DEFAULT_PASSWORD: ***REMOVED***
    ports:
      - "5050:80"
    depends_on:
      - postgres

  api:
    build: ./api
    container_name: portfolio-revamp-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      DATABASE_URL: postgres://portfolio:***REMOVED***@postgres:5432/portfolio_db?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-***REMOVED***}
      JWT_EXPIRY: 24h
      CORS_ORIGIN: https://revamp.rasasaufar.site
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-***REMOVED***123}
    depends_on:
      - postgres
    volumes:
      - api-uploads:/app/uploads

  frontend:
    build:
      context: ./app
      args:
        PUBLIC_API_BASE_URL: https://revamp.rasasaufar.site
    container_name: portfolio-revamp-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3006:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  api-uploads: