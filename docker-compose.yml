version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: portfolio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ***REMOVED***
      POSTGRES_DB: portfolio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pg***REMOVED***:
    image: dpage/pg***REMOVED***4:latest
    container_name: portfolio-pg***REMOVED***
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ***REMOVED***@portfolio.local
      PGADMIN_DEFAULT_PASSWORD: ***REMOVED***
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
